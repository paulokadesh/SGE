<!-- Sales Metrics Cards -->
<div class="mt-8">
  <div class="flex items-center space-x-2 mb-4">
    <div class="h-1 w-8 bg-gradient-to-r from-green-500 to-emerald-600 rounded-full"></div>
    <h2 class="text-xl font-semibold text-white">Métricas de Vendas</h2>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Quantidade de Vendas Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-blue-500/20 hover:scale-105 hover:border-blue-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 to-cyan-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-lg group-hover:shadow-blue-500/50 transition-shadow duration-300">
            <i class="bi bi-graph-up text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-blue-500/10 rounded-full blur-xl group-hover:bg-blue-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            {{ sales_metrics.total_sales }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Quantidade de Vendas
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-blue-500/5 to-cyan-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>

    <!-- Produtos Vendidos Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-purple-500/20 hover:scale-105 hover:border-purple-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-purple-500/10 to-violet-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl shadow-lg group-hover:shadow-purple-500/50 transition-shadow duration-300">
            <i class="bi bi-cart-check text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-purple-500/10 rounded-full blur-xl group-hover:bg-purple-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            {{ sales_metrics.total_products_sold }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Produtos Vendidos
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-purple-500/5 to-violet-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>

    <!-- Valor das Vendas Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-green-500/20 hover:scale-105 hover:border-green-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-emerald-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-green-500 to-green-600 rounded-xl shadow-lg group-hover:shadow-green-500/50 transition-shadow duration-300">
            <i class="bi bi-cash-stack text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-green-500/10 rounded-full blur-xl group-hover:bg-green-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            R$ {{ sales_metrics.total_sales_value }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Valor das Vendas
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-green-500/5 to-emerald-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>

    <!-- Lucro das Vendas Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-yellow-500/20 hover:scale-105 hover:border-yellow-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-yellow-500/10 to-amber-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-yellow-500 to-yellow-600 rounded-xl shadow-lg group-hover:shadow-yellow-500/50 transition-shadow duration-300">
            <i class="bi bi-trophy text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-yellow-500/10 rounded-full blur-xl group-hover:bg-yellow-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            R$ {{ sales_metrics.total_sales_profit }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Lucro das Vendas
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-yellow-500/5 to-amber-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>
  </div>
</div>
