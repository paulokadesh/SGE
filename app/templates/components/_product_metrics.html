<!-- Product Metrics Cards -->
<div class="mt-6">
  <div class="flex items-center space-x-2 mb-4">
    <div class="h-1 w-8 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full"></div>
    <h2 class="text-xl font-semibold text-white">Métricas de Estoque</h2>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Quantidade de Produtos Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-indigo-500/20 hover:scale-105 hover:border-indigo-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/10 to-purple-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-xl shadow-lg group-hover:shadow-indigo-500/50 transition-shadow duration-300">
            <i class="bi bi-box-seam text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-indigo-500/10 rounded-full blur-xl group-hover:bg-indigo-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            {{ product_metrics.total_quantity }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Quantidade de Produtos
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-indigo-500/5 to-purple-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>

    <!-- Custo do Estoque Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-red-500/20 hover:scale-105 hover:border-red-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-red-500/10 to-rose-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-red-500 to-red-600 rounded-xl shadow-lg group-hover:shadow-red-500/50 transition-shadow duration-300">
            <i class="bi bi-currency-dollar text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-red-500/10 rounded-full blur-xl group-hover:bg-red-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            R$ {{ product_metrics.total_cost_price }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Custo do Estoque
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-red-500/5 to-rose-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>

    <!-- Valor do Estoque Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-emerald-500/20 hover:scale-105 hover:border-emerald-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-green-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl shadow-lg group-hover:shadow-emerald-500/50 transition-shadow duration-300">
            <i class="bi bi-cash-stack text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            R$ {{ product_metrics.total_selling_price }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Valor do Estoque
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-emerald-500/5 to-green-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>

    <!-- Lucro do Estoque Card -->
    <div class="group relative bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-xl rounded-2xl p-6 border border-slate-700/50 shadow-2xl hover:shadow-amber-500/20 hover:scale-105 hover:border-amber-500/50 transition-all duration-300">
      <!-- Gradient Background Effect -->
      <div class="absolute inset-0 bg-gradient-to-br from-amber-500/10 to-yellow-600/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="relative">
        <!-- Icon Container -->
        <div class="flex items-center justify-between mb-4">
          <div class="p-3 bg-gradient-to-br from-amber-500 to-amber-600 rounded-xl shadow-lg group-hover:shadow-amber-500/50 transition-shadow duration-300">
            <i class="bi bi-graph-up-arrow text-white text-2xl"></i>
          </div>
          <div class="h-12 w-12 bg-amber-500/10 rounded-full blur-xl group-hover:bg-amber-500/20 transition-colors duration-300"></div>
        </div>

        <!-- Metric Value -->
        <div class="space-y-1">
          <p class="text-4xl font-bold text-white tracking-tight">
            R$ {{ product_metrics.total_profit }}
          </p>
          <p class="text-sm font-medium text-gray-400 group-hover:text-gray-300 transition-colors duration-300">
            Lucro do Estoque
          </p>
        </div>

        <!-- Decorative Element -->
        <div class="absolute -bottom-2 -right-2 w-24 h-24 bg-gradient-to-br from-amber-500/5 to-yellow-600/5 rounded-full blur-2xl"></div>
      </div>
    </div>
  </div>
</div>
