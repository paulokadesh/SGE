<!-- AI Agent Result Accordion -->
<div class="relative bg-gradient-to-br from-slate-800/50 to-slate-900/50 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-2xl overflow-hidden mb-6">
  <!-- Gradient Border Effect -->
  <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/20 via-purple-500/20 to-pink-500/20 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>

  <div class="relative">
    <!-- Accordion Header Button -->
    <button
      type="button"
      onclick="toggleAccordion()"
      class="w-full flex items-center justify-between p-6 text-left hover:bg-slate-700/30 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 rounded-2xl group"
      aria-expanded="false"
      aria-controls="aiResultContent"
    >
      <!-- Left Side: Icon and Title -->
      <div class="flex items-center space-x-4">
        <div class="p-3 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl shadow-lg group-hover:shadow-indigo-500/50 transition-all duration-300 group-hover:scale-110">
          <i class="bi bi-stars text-white text-2xl"></i>
        </div>
        <div>
          <h3 class="text-xl font-bold text-white group-hover:text-indigo-300 transition-colors duration-300">
            SGE AI Agent
          </h3>
          <p class="text-sm text-gray-400 mt-1">Assistente inteligente do sistema</p>
        </div>
      </div>

      <!-- Right Side: Toggle Icon -->
      <div class="flex items-center space-x-3">
        <span class="text-xs font-medium text-gray-500 hidden sm:block">Clique para expandir</span>
        <div class="p-2 bg-slate-700/50 rounded-lg transition-transform duration-300" id="accordionIcon">
          <i class="bi bi-chevron-down text-gray-400 text-lg transition-transform duration-300"></i>
        </div>
      </div>
    </button>

    <!-- Accordion Content -->
    <div
      id="aiResultContent"
      class="accordion-content max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
      aria-hidden="true"
    >
      <div class="px-6 pb-6 pt-2">
        <!-- Content Divider -->
        <div class="h-px bg-gradient-to-r from-transparent via-slate-600 to-transparent mb-6"></div>

        <!-- AI Result Content -->
        <div class="bg-slate-900/50 rounded-xl p-6 border border-slate-700/30">
          <div class="flex items-start space-x-3 mb-4">
            <div class="p-2 bg-indigo-500/10 rounded-lg">
              <i class="bi bi-robot text-indigo-400 text-xl"></i>
            </div>
            <div class="flex-1">
              <h4 class="text-sm font-semibold text-indigo-300 mb-2">Resposta do Agente:</h4>
              <div class="text-gray-300 text-sm leading-relaxed prose prose-invert prose-sm max-w-none">
                {{ ai_result|linebreaks }}
              </div>
            </div>
          </div>

          <!-- Info Footer -->
          <div class="mt-4 pt-4 border-t border-slate-700/30 flex items-center space-x-2 text-xs text-gray-500">
            <i class="bi bi-info-circle"></i>
            <span>Gerado por IA - Verifique as informações antes de tomar decisões</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript for Accordion Toggle -->
<script>
  function toggleAccordion() {
    const content = document.getElementById('aiResultContent');
    const button = content.previousElementSibling;
    const icon = document.querySelector('#accordionIcon i');
    const isExpanded = button.getAttribute('aria-expanded') === 'true';

    if (isExpanded) {
      // Collapse
      content.style.maxHeight = '0px';
      content.setAttribute('aria-hidden', 'true');
      button.setAttribute('aria-expanded', 'false');
      icon.style.transform = 'rotate(0deg)';
    } else {
      // Expand
      content.style.maxHeight = content.scrollHeight + 'px';
      content.setAttribute('aria-hidden', 'false');
      button.setAttribute('aria-expanded', 'true');
      icon.style.transform = 'rotate(180deg)';
    }
  }

  // Auto-adjust height when window resizes (if expanded)
  window.addEventListener('resize', function() {
    const content = document.getElementById('aiResultContent');
    const button = content.previousElementSibling;
    const isExpanded = button.getAttribute('aria-expanded') === 'true';

    if (isExpanded) {
      content.style.maxHeight = content.scrollHeight + 'px';
    }
  });
</script>

<!-- Additional Styles for Prose Content -->
<style>
  .accordion-content {
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Prose styling for AI result content */
  .prose p {
    margin-bottom: 0.75rem;
  }

  .prose p:last-child {
    margin-bottom: 0;
  }

  .prose a {
    color: #818cf8;
    text-decoration: underline;
  }

  .prose a:hover {
    color: #a5b4fc;
  }

  .prose strong {
    color: #e5e7eb;
    font-weight: 600;
  }

  .prose code {
    background-color: rgba(30, 41, 59, 0.5);
    padding: 0.125rem 0.375rem;
    border-radius: 0.25rem;
    font-size: 0.875rem;
    color: #c084fc;
  }

  .prose ul, .prose ol {
    margin-left: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .prose li {
    margin-bottom: 0.25rem;
  }
</style>
